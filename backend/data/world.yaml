world_id: "frontier_haven"
display_name: "暮谷镇"
era: "架空异世界,类近代奇幻,带魔法工业体雏形"
location_macro: "拓境者协会管辖的边境异常区域,村庄位于寒带与热带交界处的小盆地"
genre: "生成式智能体涌现叙事 / 循环 horror / 生活流"
tone: "悬疑"
language: "zh-CN"
notes: |
  暮谷镇看似是协会管辖下一个普通的边境据点,村民与"小魔潮"共存了几代,
  日常运转的炼金、农医、捕魔体系都为应对它而长期建立。但古老记载暗示
  这片地脉每隔几十年会爆发一次"大魔潮"——预言的日子正在临近。
  村民对此半信半疑,日子照过。气氛是宁静中暗伏的紧绷,治愈机制让恐怖
  不至沉重,但每个被治愈者都带着自己说不清的梦。Eric 想透过这个世界
  探讨身份的连续性、记忆的可信度、以及"被治愈"是否真的意味着回到原来的自己。
